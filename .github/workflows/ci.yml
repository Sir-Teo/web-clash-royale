name: Check browser arena
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  multiplayer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/browser/peer.spec.ts tests/browser/ending-performance.spec.ts tests/browser/death-audio.spec.ts tests/browser/combat-audio.spec.ts tests/browser/deployment-audio.spec.ts tests/browser/tesla-audio.spec.ts tests/browser/screen-shake.spec.ts tests/browser/balloon-bomb.spec.ts --project=desktop
        env:
          ARENA_PRODUCTION: "1"
      - run: npx playwright test tests/browser/effects.spec.ts tests/browser/spell-impacts.spec.ts tests/browser/attack-impacts.spec.ts --project=desktop
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
