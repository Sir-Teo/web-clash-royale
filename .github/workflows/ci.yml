name: Check browser arena
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  multiplayer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/offline-updates.spec.ts --project=desktop
      - run: npm run test:cache-upgrade
      - run: npm run test:hosting
      - run: npm run build
      - run: npx playwright test tests/browser/update-ui.spec.ts --project=desktop
        env:
          ARENA_PRODUCTION: "1"
      - run: npx playwright test tests/browser/game.spec.ts tests/browser/keyboard-controls.spec.ts tests/browser/modal-focus.spec.ts tests/browser/pause-menu.spec.ts tests/browser/graphics-recovery.spec.ts tests/browser/keyboard-deployment.spec.ts tests/browser/opponents.spec.ts tests/browser/minion-horde.spec.ts tests/browser/three-musketeers.spec.ts tests/browser/match-details.spec.ts tests/browser/recorded-practice.spec.ts tests/browser/card-details.spec.ts tests/browser/collection-inspection.spec.ts tests/browser/deck-codes.spec.ts tests/browser/deck-order.spec.ts tests/browser/replay-files.spec.ts tests/browser/record-identity.spec.ts tests/browser/replay-boundary.spec.ts tests/browser/replay-seeking.spec.ts tests/browser/replay-controls.spec.ts tests/browser/replay-completion.spec.ts tests/browser/progress-backup.spec.ts tests/browser/peer.spec.ts tests/browser/peer-share.spec.ts tests/browser/peer-loadout.spec.ts tests/browser/peer-rematch.spec.ts tests/browser/deployment-feedback.spec.ts tests/browser/freeze-card.spec.ts tests/browser/poison-card.spec.ts tests/browser/rage-card.spec.ts tests/browser/rocket-card.spec.ts tests/browser/rocket-card-source.spec.ts tests/browser/lightning-card.spec.ts tests/browser/ending-performance.spec.ts tests/browser/death-audio.spec.ts tests/browser/combat-audio.spec.ts tests/browser/prince-charge-audio.spec.ts tests/browser/deployment-audio.spec.ts tests/browser/tesla-audio.spec.ts tests/browser/screen-shake.spec.ts tests/browser/balloon-bomb.spec.ts --project=desktop
        env:
          ARENA_PRODUCTION: "1"
      - run: npx playwright test tests/browser/effects.spec.ts tests/browser/freeze.spec.ts tests/browser/poison.spec.ts tests/browser/rage.spec.ts tests/browser/rage-source.spec.ts tests/browser/deployment-effects.spec.ts tests/browser/spell-impacts.spec.ts tests/browser/rocket.spec.ts tests/browser/rocket-trail.spec.ts tests/browser/lightning.spec.ts tests/browser/ai-spells.spec.ts tests/browser/ai-defense.spec.ts tests/browser/ai-area-spells.spec.ts tests/browser/ai-support-spells.spec.ts tests/browser/attack-impacts.spec.ts tests/browser/movement-effects.spec.ts tests/browser/hog-jump.spec.ts --project=desktop

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
  phone-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run build
      - run: npx playwright test tests/browser/game.spec.ts tests/browser/keyboard-controls.spec.ts tests/browser/modal-focus.spec.ts tests/browser/pause-menu.spec.ts tests/browser/graphics-recovery.spec.ts tests/browser/keyboard-deployment.spec.ts tests/browser/opponents.spec.ts tests/browser/minion-horde.spec.ts tests/browser/three-musketeers.spec.ts tests/browser/match-details.spec.ts tests/browser/recorded-practice.spec.ts tests/browser/card-details.spec.ts tests/browser/collection-inspection.spec.ts tests/browser/deck-codes.spec.ts tests/browser/deck-order.spec.ts tests/browser/replay-files.spec.ts tests/browser/record-identity.spec.ts tests/browser/replay-boundary.spec.ts tests/browser/replay-seeking.spec.ts tests/browser/replay-controls.spec.ts tests/browser/replay-completion.spec.ts tests/browser/progress-backup.spec.ts tests/browser/peer-loadout.spec.ts tests/browser/peer-rematch.spec.ts tests/browser/deployment-feedback.spec.ts tests/browser/rage-card.spec.ts tests/browser/rocket-card.spec.ts tests/browser/rocket-card-source.spec.ts tests/browser/mobile.spec.ts tests/browser/offline-updates.spec.ts tests/browser/update-ui.spec.ts --project=mobile-safari
        env:
          ARENA_PRODUCTION: "1"
      - run: npx playwright test tests/browser/rage.spec.ts tests/browser/rage-source.spec.ts tests/browser/rocket.spec.ts tests/browser/ai-spells.spec.ts tests/browser/ai-defense.spec.ts tests/browser/ai-area-spells.spec.ts tests/browser/ai-support-spells.spec.ts --project=mobile-safari
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: phone-browser-failure
          path: test-results/
          retention-days: 7
  player-workflows:
    name: Practice and replay flows (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: mobile
            browser: chromium
          - project: mobile-safari
            browser: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run test:workflows -- --project=${{ matrix.project }}
        env:
          ARENA_PRODUCTION: "1"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: player-workflows-${{ matrix.project }}
          path: test-results/
          retention-days: 7
