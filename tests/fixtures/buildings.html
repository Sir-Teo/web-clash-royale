<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Native building frames</title>
    <style>
      body {
        margin: 0;
        background: #19382c;
        color: #edf9f2;
        font: 14px system-ui;
      }
      header {
        padding: 12px;
      }
      main {
        height: 900px;
        position: relative;
      }
      canvas {
        width: 100%;
        height: 100%;
      }
      .labels {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: repeat(4, 1fr);
        pointer-events: none;
      }
      .labels span {
        padding: 8px;
      }
      select {
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      Native building frames
      <select id="building">
        <option value="cannon">Cannon directions</option>
        <option value="tesla">Tesla timeline</option>
      </select>
    </header>
    <main><div class="labels"></div></main>
    <script type="module" src="./buildings.ts"></script>
  </body>
</html>
