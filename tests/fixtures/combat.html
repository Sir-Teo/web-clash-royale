<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combat inspection</title>
    <style>
      @font-face {
        font-family: "Supercell Magic";
        src: url("/assets/ui/supercell-magic.ttf") format("truetype");
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #123a43;
        color: #fff;
        font: 14px system-ui;
      }
      header {
        flex: none;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button,
      select {
        padding: 9px;
        background: #225360;
        color: #fff;
        border: 1px solid #81a9ad;
        border-radius: 6px;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
      }
      .tower-labels {
        display: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      small {
        color: #bedce0;
      }
      #crown-score {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 5;
        display: flex;
        gap: 14px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #17312ddd;
        pointer-events: none;
      }
      #crown-red {
        color: #ff8e8e;
      }
      #crown-blue {
        color: #87d4ff;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Combat inspection</b
      ><label
        >Scene
        <select id="scenario">
          <option value="volley">Fireball &amp; Arrows</option>
          <option value="ai-rage">AI Rage push</option>
          <option value="ai-freeze">AI Freeze support</option>
          <option value="ai-freeze-king">AI Freeze King defense</option>
          <option value="ai-freeze-race">AI King finisher race</option>
          <option value="ai-freeze-ranged">AI ranged King defense</option>
          <option value="ai-freeze-ranged-fast">AI ranged King race</option>
          <option value="ai-poison">AI Poison group</option>
          <option value="ai-heal">AI Heal recovery</option>
          <option value="ai-clone">AI Clone push</option>
          <option value="ai-spells">AI spell finish</option>
          <option value="ai-lightning">AI Lightning group</option>
          <option value="ai-lightning-combo">AI Lightning and Zap combination</option>
          <option value="ai-log-ground">AI Log ground corridor</option>
          <option value="ai-log-air">AI Log holds against air</option>
          <option value="ai-log-king">AI Log King finisher</option>
          <option value="ai-tornado-king">AI Tornado King defense</option>
          <option value="ai-tornado-race">AI Tornado before a late Rocket</option>
          <option value="ai-tornado-air">AI Tornado air group</option>
          <option value="ai-lightning-health">AI Lightning after incoming damage</option>
          <option value="ai-lightning-followup">AI Lightning and Fireball reserve</option>
          <option value="ai-lightning-king">AI Lightning King finish</option>
          <option value="ai-spells-mirror">AI Mirror cost</option>
          <option value="ai-launched-poison">AI launched-shot Poison race</option>
          <option value="ai-launched-zap">AI launched-shot Zap race</option>
          <option value="ai-overtime">AI sudden-death finisher</option>
          <option value="ai-regulation">AI regulation lead</option>
          <option value="ai-regulation-tie">AI regulation save</option>
          <option value="ai-overtime-reserved">AI queued sudden-death win</option>
          <option value="ai-tiebreaker">AI final-clock chip</option>
          <option value="ai-defense-lane">AI weak tower defense</option>
          <option value="ai-defense-moving-left">
            AI moving Hog interception, left
          </option>
          <option value="ai-defense-moving-right">
            AI moving Hog interception, right
          </option>
          <option value="ai-defense-center">AI central defense</option>
          <option value="ai-defense-ground-swarm">
            AI ground swarm defense
          </option>
          <option value="ai-defense-air-swarm">AI air swarm defense</option>
          <option value="ai-defense-fallback-missing">
            AI fallback without an air counter
          </option>
          <option value="ai-defense-fallback-unaffordable">
            AI fallback while the air counter is too expensive
          </option>
          <option value="ai-defense-balloon">AI Balloon distraction</option>
          <option value="ai-defense-balloon-blocked">
            AI occupied Balloon distraction
          </option>
          <option value="rocket">Rocket flight and blast</option>
          <option value="rocket-trail">Rocket trail and explosion</option>
          <option value="fireball">Fireball explosion</option>
          <option value="lightning">Lightning target strikes</option>
          <option value="log">The Log rolling impact</option>
          <option value="tornado">Tornado native whirl and pull</option>
          <option value="goblin-barrel">
            Goblin Barrel flight and landing
          </option>
          <option value="graveyard">
            Graveyard native ground and spawning
          </option>
          <option value="clone">Clone hologram and area</option>
          <option value="spell-impacts">Zap &amp; Arrows impacts</option>
          <option value="freeze">Freeze area and snow</option>
          <option value="rage-troops">Rage troops</option>
          <option value="rage">Rage area and friendly buffs</option>
          <option value="poison">Poison area and skulls</option>
          <option value="attack-impacts">Projectile hit effects</option>
          <option value="elixir-collector">Elixir Collector pump cycle</option>
          <option value="goblin-hut">Goblin Hut spawning</option>
          <option value="tombstone">Tombstone spawn and death burst</option>
          <option value="furnace">Furnace Fire Spirit waves</option>
          <option value="barbarian-hut">Barbarian Hut waves</option>
          <option value="miner">Miner underground travel</option>
          <option value="bowler">Bowler rolling boulder</option>
          <option value="dark-prince">Dark Prince shield and charge</option>
          <option value="guards">Guards shield and formation</option>
          <option value="battle-ram">
            Battle Ram charge and Barbarian release
          </option>
          <option value="ice-wizard">
            Ice Wizard native projectile and slow
          </option>
          <option value="executioner">Executioner returning axe</option>
          <option value="sparky">Sparky charging cannon</option>
          <option value="lumberjack">Lumberjack falling Rage bottle</option>
          <option value="bats">Bats flying swarm and native wiggle</option>
          <option value="night-witch">
            Night Witch Bat summons and death release
          </option>
          <option value="bandit">Bandit untouchable dash</option>
          <option value="golem">Golem explosion and Golemite split</option>
          <option value="ice-golem">Ice Golem death slow</option>
          <option value="giant-skeleton">Giant Skeleton timed bomb</option>
          <option value="lava-hound">
            Lava Hound flight and six Lava Pups
          </option>
          <option value="footsteps">Footstep dust</option>
          <option value="hog-jump">Hog Rider river jump</option>
          <option value="ranged">Ranged projectiles</option>
          <option value="tesla">Tesla &amp; Zap</option>
          <option value="burrow">Defensive buildings</option>
          <option value="king">King Tower activation</option>
          <option value="princess">Tower Princess attacks</option>
          <option value="death">Troop death effects</option>
          <option value="deployment">Troop deployment effects</option>
          <option value="melee">Melee timing</option>
        </select></label
      ><button id="play">Play</button><button id="step">Step 0.1s</button
      ><button id="second">Step 1s</button><button id="reset">Reset</button
      ><button id="kill-night-witch" hidden>Defeat Night Witch</button
      ><button id="kill-tombstone" hidden>Destroy Tombstone</button
      ><button id="kill-golem" hidden>Defeat Golem</button
      ><button id="kill-ice-golem" hidden>Defeat Ice Golem</button
      ><button id="kill-giant-skeleton" hidden>Defeat Giant Skeleton</button
      ><button id="kill-lava-hound" hidden>Defeat Lava Hound</button
      ><button id="break-shield" hidden>Break shield</button
      ><button id="attackers" hidden>Toggle attackers</button
      ><button id="wake" hidden>Zap Kings</button
      ><button id="princess" hidden>Destroy Princess Towers</button
      ><button id="destroy-king" hidden>Destroy red King</button
      ><button id="destroy-both-kings" hidden>Destroy both Kings</button
      ><button id="rebuild" hidden>Rebuild renderer</button
      ><label id="death-config" hidden
        >Troop
        <select id="death-card"></select></label
      ><label id="attack-config" hidden
        >Attacker
        <select id="attack-card">
          <option value="giant">Giant</option>
          <option value="ice-spirit">Ice Spirit</option>
          <option value="fire-spirits">Fire Spirits</option>
          <option value="musketeer">Musketeer</option>
          <option value="bomber">Bomber</option>
          <option value="baby-dragon">Baby Dragon</option>
          <option value="inferno-dragon">Inferno Dragon</option>
          <option value="inferno-tower">Inferno Tower</option>
          <option value="x-bow">X-Bow</option>
          <option value="electro-wizard">Electro Wizard</option>
          <option value="wizard">Wizard</option>
          <option value="cannon">Cannon</option>
          <option value="bomb-tower">Bomb Tower</option>
          <option value="balloon">Balloon</option>
          <option value="tesla">Tesla</option>
        </select></label
      ><button id="defeat" hidden>Defeat troops</button
      ><button id="spawn" hidden>Deploy both teams</button
      ><button id="freeze-cast" hidden>Cast Freeze both sides</button
      ><button id="rage-cast" hidden>Cast Rage both sides</button
      ><button id="rage-towers" hidden>Rage Princess Towers</button
      ><button id="poison-cast" hidden>Cast Poison both sides</button
      ><button id="tornado-cast" hidden>Cast Tornado</button
      ><button id="poison-towers" hidden>Poison Princess Towers</button
      ><button id="freeze-towers" hidden>Freeze Princess Towers</button
      ><small id="status">Loading</small><small id="buildings"></small
      ><small id="particles"></small>
      <small id="kings"></small>
      <small id="king-hits"></small>
      <small id="destruction"></small>
      <small id="result-state"></small>
      <small id="death-stats"></small>
      <small id="crown-flights"></small>
    </header>
    <main id="arena">
      <div id="crown-score">
        <span id="crown-red">♛ 0</span><span id="crown-blue">♛ 0</span>
      </div>
    </main>
    <script type="module" src="./combat.ts"></script>
  </body>
</html>
