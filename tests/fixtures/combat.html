<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combat inspection</title>
    <style>
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #123a43;
        color: #fff;
        font: 14px system-ui;
      }
      header {
        flex: none;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button,
      select {
        padding: 9px;
        background: #225360;
        color: #fff;
        border: 1px solid #81a9ad;
        border-radius: 6px;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
      }
      .tower-labels {
        display: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      small {
        color: #bedce0;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Combat inspection</b
      ><label
        >Scene
        <select id="scenario">
          <option value="volley">Fireball &amp; Arrows</option>
          <option value="ranged">Ranged projectiles</option>
          <option value="tesla">Tesla &amp; Zap</option>
          <option value="burrow">Defensive buildings</option>
          <option value="king">King Tower activation</option>
          <option value="melee">Melee timing</option>
        </select></label
      ><button id="play">Play</button><button id="step">Step 0.1s</button
      ><button id="second">Step 1s</button><button id="reset">Reset</button
      ><button id="attackers" hidden>Toggle attackers</button
      ><button id="wake" hidden>Zap Kings</button
      ><button id="princess" hidden>Destroy Princess Towers</button
      ><small id="status">Loading</small><small id="buildings"></small
      ><small id="particles"></small>
      <small id="kings"></small>
      <small id="king-hits"></small>
    </header>
    <main id="arena"></main>
    <script type="module" src="./combat.ts"></script>
  </body>
</html>
