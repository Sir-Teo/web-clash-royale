<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bandit ordinary cadence inspection</title>
    <style>
      body {
        color-scheme: dark;
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #123a43;
        color: white;
        font: 14px system-ui;
      }
      header {
        padding: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button,
      select {
        padding: 9px;
        background: #225360;
        color: white;
        border: 1px solid #81a9ad;
        border-radius: 6px;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 760px;
        margin: auto;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      output {
        display: block;
        padding: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <select id="team" aria-label="Bandit team"><option>blue</option><option>red</option></select>
      <select id="rules" aria-label="Rules"><option>53</option><option>52</option></select>
      <select id="buff" aria-label="Attack modifier"><option value="rage">Rage</option><option value="normal">Normal</option></select>
      <button id="advance">First melee hit</button><button id="launch">Four melee hits</button><button id="replay">Replay</button>
    </header>
    <main id="arena"></main>
    <output id="status"></output>
    <script type="module" src="./bandit-cadence.ts"></script>
  </body>
</html>
