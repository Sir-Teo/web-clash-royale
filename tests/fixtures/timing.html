<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native battle announcements</title>
    <style>
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #123a43;
        color: white;
        font: 14px system-ui;
      }
      header {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding: 10px;
        flex: none;
      }
      button,
      select {
        padding: 9px;
        background: #225360;
        color: white;
        border: 1px solid #81a9ad;
        border-radius: 6px;
      }
      main {
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 760px;
        margin: auto;
        position: relative;
      }
      #arena {
        position: absolute;
        inset: 0;
      }
      .hidden {
        display: none !important;
      }
      .tower-labels {
        display: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #clock {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 8px 12px;
        background: #19372ed9;
        border-radius: 8px;
        text-align: center;
      }
      #clock b {
        display: block;
        font:
          24px "Supercell Magic",
          system-ui;
        margin-top: 5px;
      }
      small {
        color: #c1dde0;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Native announcements</b>
      <select id="jump" aria-label="Moment">
        <option value="120.5">60 seconds left</option>
        <option value="123.2">Double elixir</option>
        <option value="150.5">30 seconds left</option>
        <option value="168.5">Countdown lead-in</option>
        <option value="170.5">10 seconds</option>
        <option value="175.5">5 seconds</option>
        <option value="179.5">1 second</option>
        <option value="180">Overtime boundary</option>
        <option value="180.5">Sudden death</option>
        <option value="182.8">Extra time</option>
        <option value="243.2">Triple elixir</option>
        <option value="295.5">Final countdown</option>
      </select>
      <button id="play">Play</button><button id="step">Step 1 frame</button>
      <button id="speed">1×</button><button id="finish">Finish here</button>
      <label><input id="sound" type="checkbox" /> Sound</label>
      <small id="status">Loading</small><small id="cue"></small>
    </header>
    <main>
      <div id="arena"></div>
      <div id="clock">
        <span id="phase-label">TIME LEFT</span><b id="match-clock"></b>
      </div>
      <div
        id="battle-announcements"
        class="battle-announcements hidden"
        role="img"
        aria-label="Battle announcement"
      ></div>
    </main>
    <script type="module" src="./timing.ts"></script>
  </body>
</html>
