<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Native battle ending</title>
  </head>
  <body>
    <main>
      <h1>Native battle ending</h1>
      <p id="status">Loading source timelines…</p>
      <section class="controls">
        <label
          >Time
          <input
            id="time"
            type="number"
            min="0"
            max="6"
            step="0.1"
            value="3.1" /></label
        ><label
          >Player <input id="player" value="Sir Teo" maxlength="18" /></label
        ><label
          >Opponent
          <input id="enemy" value="Royal Trainer" maxlength="18" /></label
        ><label
          >Blue crowns
          <input id="blue" type="number" min="0" max="3" value="3" /></label
        ><label
          >Red crowns
          <input id="red" type="number" min="0" max="3" value="1" /></label
        ><label
          >Blue earned
          <input id="earned" type="number" min="0" max="3" value="2" /></label
        ><label><input id="hold" type="checkbox" />Still final score</label
        ><button id="step">Step 0.1s</button><button id="reset">Restart</button>
      </section>
      <div class="stage">
        <section
          id="ending"
          class="battle-ending hidden"
          aria-label="Battle ended"
        ></section>
      </div>
    </main>
    <script type="module" src="./ending.ts"></script>
  </body>
</html>
