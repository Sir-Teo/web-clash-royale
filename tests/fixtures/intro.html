<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native battle introduction</title>
    <style>
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #123a43;
        color: white;
        font: 14px system-ui;
      }
      header {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding: 10px;
        flex: none;
      }
      button,
      select,
      input {
        padding: 9px;
        background: #225360;
        color: white;
        border: 1px solid #81a9ad;
        border-radius: 6px;
      }
      input {
        width: 150px;
      }
      main {
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 760px;
        margin: auto;
        position: relative;
      }
      #arena {
        position: absolute;
        inset: 0;
      }
      .hidden {
        display: none !important;
      }
      .tower-labels {
        display: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      small {
        color: #c1dde0;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Native battle opening</b>
      <select id="frame" aria-label="Opening frame">
        <option value="0">0 · opening</option>
        <option value="20">20 · arena title</option>
        <option value="70" selected>70 · player ribbons</option>
        <option value="103">103 · action</option>
        <option value="110">110 · fight</option>
        <option value="120">120 · release</option>
        <option value="133">133 · final frame</option>
      </select>
      <input
        id="name"
        aria-label="Player name"
        maxlength="18"
        value="Sir Teo"
      />
      <select id="mode" aria-label="Battle mode">
        <option value="classic">Classic</option>
        <option value="training">Training</option>
      </select>
      <button id="play">Play</button><button id="step">Step 1 frame</button
      ><button id="reset">Restart</button>
      <small id="status">Loading</small>
    </header>
    <main>
      <div id="arena"></div>
      <div
        class="battle-intro hidden"
        id="battle-intro"
        role="img"
        aria-label="Battle introduction"
      ></div>
    </main>
    <script type="module" src="./intro.ts"></script>
  </body>
</html>
