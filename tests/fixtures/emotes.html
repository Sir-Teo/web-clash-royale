<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Native King emotes</title>
  </head>
  <body>
    <main>
      <h1>Native King emotes</h1>
      <p id="status">Loading source timelines…</p>
      <div class="controls">
        <label
          >Expression
          <select id="kind">
            <option value="laugh">Laugh</option>
            <option value="thumbs">Thumbs up</option>
            <option value="cry">Cry</option>
            <option value="angry">Angry</option>
          </select></label
        ><button id="blue-show">Show player</button
        ><button id="red-show">Show opponent</button
        ><label
          >Time
          <input
            id="time"
            type="number"
            value="0"
            min="0"
            max="3"
            step="0.1" /></label
        ><button id="step">Step frame</button
        ><label><input id="playing" type="checkbox" />Play</label
        ><label><input id="sound" type="checkbox" />Sound</label
        ><button id="reset">Reset</button>
      </div>
      <div class="stage">
        <div id="emotes"></div>
        <div class="battle-tools"><button id="toggle">Emotes</button></div>
      </div>
      <output id="cue"></output>
    </main>
    <script type="module" src="./emotes.ts"></script>
  </body>
</html>
