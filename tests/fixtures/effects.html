<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Native projectile frames</title>
    <style>
      body {
        margin: 0;
        background: #172c28;
        color: white;
        font: 14px system-ui;
      }
      header {
        padding: 10px;
      }
      main {
        position: relative;
        height: 900px;
      }
      canvas {
        width: 100%;
        height: 100%;
      }
      .labels {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: repeat(6, 1fr);
        pointer-events: none;
      }
      .labels span {
        padding: 8px;
        color: #ceded6;
      }
      select {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      Original projectile orientations — each cell shows a consecutive source
      frame.
      <select id="page">
        <option value="0">Projectile directions</option>
        <option value="1">Animated effects</option>
      </select>
    </header>
    <main><div class="labels"></div></main>
    <script type="module" src="./effects.ts"></script>
  </body>
</html>
