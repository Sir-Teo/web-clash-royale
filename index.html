<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#13233d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Browser Arena" />
    <meta
      name="description"
      content="Build your deck. Command your army. Take the crown. An independent Clash Royale browser fan game."
    />
    <title>Clash Royale · Browser Arena</title>
    <link rel="icon" type="image/svg+xml" href="/crown.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <style>
      body {
        margin: 0;
        background: #13233d;
      }
      #startup {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        color: #eef5ff;
        font: 700 16px system-ui;
      }
      #startup img {
        width: 64px;
        height: 64px;
      }
      #startup button {
        min-height: 44px;
        padding: 10px 24px;
        border: 0;
        border-radius: 8px;
        background: #ffc84f;
        color: #533513;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="startup" role="status">
        <img src="/crown.svg" alt="" />
        <p id="startup-status">Loading the arena…</p>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
